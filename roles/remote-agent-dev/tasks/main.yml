---
- name: Create remote agent user
  ansible.builtin.user:
    name: "{{ remote_agent_dev_user }}"
    home: "{{ remote_agent_dev_user_home }}"
    shell: "{{ remote_agent_dev_user_shell }}"
    create_home: true
    groups:
      - sudo
    append: true
    state: present

- name: Set remote agent password
  ansible.builtin.user:
    name: "{{ remote_agent_dev_user }}"
    password: "{{ remote_agent_dev_password_hash }}"
    update_password: always
  no_log: true
  when: remote_agent_dev_password_hash | length > 0

- name: Look up authorized keys source user
  ansible.builtin.getent:
    database: passwd
    key: "{{ remote_agent_dev_authorized_keys_source_user }}"

- name: Read source authorized keys
  ansible.builtin.slurp:
    src: "{{ ansible_facts.getent_passwd[remote_agent_dev_authorized_keys_source_user][4] }}/.ssh/authorized_keys"
  register: remote_agent_dev_source_authorized_keys

- name: Create remote agent SSH directory
  ansible.builtin.file:
    path: "{{ remote_agent_dev_user_home }}/.ssh"
    state: directory
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0700"

- name: Create remote agent code directory
  ansible.builtin.file:
    path: "{{ remote_agent_dev_code_dir }}"
    state: directory
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0755"

- name: Create remote agent Codex config directory
  ansible.builtin.file:
    path: "{{ remote_agent_dev_codex_dir }}"
    state: directory
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0755"

- name: Create remote agent Codex config file
  ansible.builtin.file:
    path: "{{ remote_agent_dev_codex_config_path }}"
    state: touch
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve

- name: Ensure remote agent Codex config settings
  ansible.builtin.lineinfile:
    path: "{{ remote_agent_dev_codex_config_path }}"
    regexp: "^{{ item.key }}\\s*="
    line: '{{ item.key }} = "{{ item.value }}"'
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0644"
  loop: "{{ remote_agent_dev_codex_config | dict2items }}"

- name: Install remote agent authorized keys
  ansible.builtin.copy:
    dest: "{{ remote_agent_dev_user_home }}/.ssh/authorized_keys"
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0600"
    content: "{{ remote_agent_dev_source_authorized_keys.content | b64decode }}"
    force: false

- name: Create remote agent hushlogin
  ansible.builtin.file:
    path: "{{ remote_agent_dev_user_home }}/.hushlogin"
    state: touch
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when: remote_agent_dev_create_hushlogin

- name: Allow remote agent user passwordless sudo
  ansible.builtin.copy:
    dest: "{{ remote_agent_dev_sudoers_path }}"
    owner: root
    group: root
    mode: "0440"
    content: |
      {{ remote_agent_dev_user }} ALL=(ALL) NOPASSWD:ALL
    validate: /usr/sbin/visudo -cf %s

- name: Install GitHub key sync dependencies
  ansible.builtin.apt:
    name: "{{ remote_agent_dev_key_sync_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install GitHub key sync script
  ansible.builtin.template:
    src: sync-agent-github-keys.j2
    dest: "{{ remote_agent_dev_key_sync_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Run GitHub key sync

- name: Install GitHub key sync service
  ansible.builtin.template:
    src: sync-agent-github-keys.service.j2
    dest: "/etc/systemd/system/{{ remote_agent_dev_key_sync_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install GitHub key sync timer
  ansible.builtin.template:
    src: sync-agent-github-keys.timer.j2
    dest: "/etc/systemd/system/{{ remote_agent_dev_key_sync_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable GitHub key sync timer
  ansible.builtin.systemd:
    name: "{{ remote_agent_dev_key_sync_timer_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Run GitHub key sync now
  ansible.builtin.command: "{{ remote_agent_dev_key_sync_script_path }}"
  changed_when: false

- name: Install Fast Node Manager for the remote agent
  ansible.builtin.include_role:
    name: fast_node_manager
  vars:
    fast_node_manager_user: "{{ remote_agent_dev_user }}"
    fast_node_manager_user_home: "{{ remote_agent_dev_user_home }}"

- name: Install OpenAI Codex CLI
  ansible.builtin.include_role:
    name: openai_codex_cli
  vars:
    openai_codex_cli_user: "{{ remote_agent_dev_user }}"
    openai_codex_cli_user_home: "{{ remote_agent_dev_user_home }}"
    openai_codex_cli_binary_path: "{{ remote_agent_dev_user_home }}/.local/bin/codex"

- name: Install Tailscale
  ansible.builtin.include_role:
    name: tailscale_host

- name: Install Paseo CLI
  community.general.npm:
    name: "{{ remote_agent_dev_paseo_npm_package }}"
    global: true
    state: present
    version: "{{ remote_agent_dev_paseo_version }}"

- name: Require Paseo password authentication
  ansible.builtin.assert:
    that:
      - remote_agent_dev_paseo_password_hash | length > 0
    fail_msg: Set remote_agent_dev_paseo_password_hash to a bcrypt password hash.
  no_log: true

- name: Create Paseo home directory
  ansible.builtin.file:
    path: "{{ remote_agent_dev_paseo_home }}"
    state: directory
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0700"

- name: Configure Paseo daemon
  ansible.builtin.template:
    src: paseo-config.json.j2
    dest: "{{ remote_agent_dev_paseo_config_path }}"
    owner: "{{ remote_agent_dev_user }}"
    group: "{{ remote_agent_dev_user }}"
    mode: "0600"
  no_log: true
  notify: Restart Paseo

- name: Install Paseo systemd service
  ansible.builtin.template:
    src: paseo.service.j2
    dest: "/etc/systemd/system/{{ remote_agent_dev_paseo_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Paseo

- name: Enable and start Paseo
  ansible.builtin.systemd:
    name: "{{ remote_agent_dev_paseo_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: "{{ remote_agent_dev_github_cli_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Verify GitHub CLI is available
  ansible.builtin.command: gh --version
  changed_when: false
  register: remote_agent_dev_gh_version

- name: Show installed GitHub CLI version
  ansible.builtin.debug:
    msg: "{{ remote_agent_dev_gh_version.stdout_lines[0] }}"
