---
openai_chatgpt_desktop_supported_distributions:
  Ubuntu:
    - "24.04"
    - "26.04"
  Debian:
    - "13"
openai_chatgpt_desktop_deb_architectures:
  aarch64: arm64
  arm64: arm64
  x86_64: amd64
openai_chatgpt_desktop_deb_architecture: >-
  {{ openai_chatgpt_desktop_deb_architectures[ansible_facts.architecture] }}
openai_chatgpt_desktop_package_url: >-
  https://persistent.oaistatic.com/codex-app-prod/linux/deb/latest/chatgpt_{{ openai_chatgpt_desktop_deb_architecture }}.deb
openai_chatgpt_desktop_cache_dir: /var/cache/openai-chatgpt
openai_chatgpt_desktop_package_path: >-
  {{ openai_chatgpt_desktop_cache_dir }}/chatgpt_{{ openai_chatgpt_desktop_deb_architecture }}.deb
