---
riffgraph_user: agent
riffgraph_group: agent
riffgraph_user_home: "/home/{{ riffgraph_user }}"

riffgraph_root: /opt/riffgraph
riffgraph_releases_dir: "{{ riffgraph_root }}/releases"
riffgraph_current_link: "{{ riffgraph_root }}/current"
riffgraph_app_dir: "{{ riffgraph_current_link }}/app"
riffgraph_venv_dir: "{{ riffgraph_root }}/venvs"
riffgraph_core_venv: "{{ riffgraph_current_link }}/venv"
riffgraph_legacy_muscriptor_venv: >-
  {{ riffgraph_venv_dir }}/muscriptor-py{{ riffgraph_python_abi }}
riffgraph_cache_dir: "{{ riffgraph_root }}/cache"
riffgraph_uv_cache_dir: "{{ riffgraph_cache_dir }}/uv"
riffgraph_python_dir: "{{ riffgraph_root }}/python"
riffgraph_python_uv_cache_dir: /var/cache/riffgraph-uv
riffgraph_project_dir: "{{ riffgraph_root }}/projects"

riffgraph_local_source: /home/k/code/riffgraph
riffgraph_python_version: "3.12.13"
riffgraph_python_abi: "3.12"
riffgraph_python_runtime_dir: >-
  {{ riffgraph_python_dir }}/cpython-{{ riffgraph_python_version }}-linux-x86_64-gnu
riffgraph_python_executable: >-
  {{ riffgraph_python_runtime_dir }}/bin/python{{ riffgraph_python_abi }}

riffgraph_uv_version: "0.11.29"
riffgraph_uv_archive: "uv-x86_64-unknown-linux-gnu.tar.gz"
riffgraph_uv_url: >-
  https://github.com/astral-sh/uv/releases/download/{{ riffgraph_uv_version }}/{{ riffgraph_uv_archive }}
riffgraph_uv_sha256: 04f8b82f5d47f0512dcd32c67a4a6f16a0ea27c81537c338fd0ad6b23cebe829
riffgraph_uv_install_dir: "/opt/uv/{{ riffgraph_uv_version }}"
riffgraph_uv_binary: >-
  {{ riffgraph_uv_install_dir }}/uv-x86_64-unknown-linux-gnu/uv

riffgraph_muscriptor_version: "0.2.1"
riffgraph_muscriptor_model: small
riffgraph_hf_token_source: /home/k/.cache/huggingface/token
riffgraph_hf_home: "{{ riffgraph_user_home }}/.cache/huggingface"

riffgraph_soundfont: /usr/share/sounds/sf2/FluidR3_GM.sf2
riffgraph_disable_fluidsynth_daemon: true

riffgraph_tools_dir: "{{ riffgraph_root }}/tools"
riffgraph_asset_cache_dir: "{{ riffgraph_root }}/cache/assets"
riffgraph_instruments_dir: "{{ riffgraph_root }}/instruments"
riffgraph_active_instruments_dir: "{{ riffgraph_instruments_dir }}/active"

riffgraph_sfizz_version: "1.2.3"
riffgraph_sfizz_url: >-
  https://github.com/sfztools/sfizz/releases/download/{{ riffgraph_sfizz_version }}/sfizz-{{ riffgraph_sfizz_version }}.tar.gz
riffgraph_sfizz_sha256: a9339eac7620d7f0f6b44bdfe860680fab73e66efad4b5f15b21198dd9436822
riffgraph_sfizz_archive: >-
  {{ riffgraph_asset_cache_dir }}/sfizz-{{ riffgraph_sfizz_version }}.tar.gz
riffgraph_sfizz_source_dir: >-
  {{ riffgraph_tools_dir }}/sfizz-{{ riffgraph_sfizz_version }}/source
riffgraph_sfizz_build_dir: >-
  {{ riffgraph_tools_dir }}/sfizz-{{ riffgraph_sfizz_version }}/build
riffgraph_sfizz_binary: >-
  {{ riffgraph_tools_dir }}/sfizz-{{ riffgraph_sfizz_version }}/bin/sfizz_render

riffgraph_nam_core_version: "0.5.4"
riffgraph_nam_core_commit: 1f42f88535884450104b8711d7595019afa0495b
riffgraph_nam_core_url: >-
  https://github.com/sdatkinson/NeuralAmpModelerCore/archive/{{ riffgraph_nam_core_commit }}.tar.gz
riffgraph_nam_core_sha256: ac10cdabb0a7408e660d5cc403d1260c966bc839b5b5bb71511b663ca6e4a0cf
riffgraph_nam_core_archive: >-
  {{ riffgraph_asset_cache_dir }}/NeuralAmpModelerCore-{{ riffgraph_nam_core_commit }}.tar.gz
riffgraph_nam_core_dir: >-
  {{ riffgraph_tools_dir }}/neural-amp-modeler-core-{{ riffgraph_nam_core_version }}
riffgraph_nam_core_source_dir: "{{ riffgraph_nam_core_dir }}/source"
riffgraph_nam_core_build_dir: "{{ riffgraph_nam_core_dir }}/build"
riffgraph_nam_render_binary: "{{ riffgraph_nam_core_dir }}/bin/nam-render"

riffgraph_nam_audiodsp_commit: 0827c6c2fc0deced568536142ea86f189e0b98a1
