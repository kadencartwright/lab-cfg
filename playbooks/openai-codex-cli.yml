---
- name: Install OpenAI Codex CLI
  hosts: remote_agent_dev_hosts
  gather_facts: true
  become: true
  remote_user: agent
  vars:
    ansible_user: agent
    ansible_ssh_private_key_file: /home/k/.ssh/id_ed25519_github_to_bitbucket_key
  roles:
    - role: openai_codex_cli
      openai_codex_cli_user: agent
      openai_codex_cli_user_home: /home/agent
      openai_codex_cli_binary_path: /home/agent/.local/bin/codex
